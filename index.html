<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15121f">
<title>Bradavický archiv</title>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}

body{
margin:0;
padding:14px;
background:
radial-gradient(circle,#c9ab6555 1px,transparent 2px) 0 0/113px 137px,
radial-gradient(ellipse at top,#30263e,#100e18 75%) fixed;
color:#e8d4a5;
font-family:Georgia,serif;
}

main{max-width:1000px;margin:auto}

.panel,.set{
border:1px solid #9d8050;
border-radius:12px;
background:#1b1725;
padding:14px;
margin-bottom:14px;
box-shadow:0 5px 20px #0005;
}

header,#login{text-align:center}
#login{max-width:420px;margin:8vh auto}

h1{
font-size:clamp(25px,5vw,38px);
color:#f3d58d;
}

h2{
text-align:center;
color:#f3d58d;
font-size:22px;
margin:32px 0 18px;
}

h3{font-size:16px;margin:0}
.magic{font-size:36px;color:#edcc80}
small{letter-spacing:1px}

input,button,select{
font:inherit;
font-size:16px;
border:1px solid #927746;
border-radius:7px;
padding:12px;
background:#262032;
color:#e8d4a5;
touch-action:manipulation;
}

input,#login button{
width:100%;
margin:5px 0;
}

button{cursor:pointer}
button:disabled{opacity:.5}

.primary{
background:#e6c477;
color:#302013;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin:12px 0;
}

.stat{
border:1px solid #76603d;
border-radius:7px;
padding:10px 2px;
font-size:12px;
}

.stat b{
display:block;
font-size:25px;
}

.tokens{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.tokens .stat:first-child{color:#b9caff}
.tokens .stat:last-child{color:#e7b6ff}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin-top:14px;
}

.heading{
display:flex;
justify-content:space-between;
gap:8px;
align-items:center;
}

.cards{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:5px;
margin:12px 0;
}

/* BRONZOVÉ KARTY */

.card{
padding:3px;
min-width:0;
min-height:100px;
aspect-ratio:3/4;
background:linear-gradient(
145deg,#e5b68a,#a56839 45%,#704021 75%,#c58a55
);
color:#fff0d5;
border:2px solid #c68d59;
text-shadow:0 1px 3px #0008;
}

/* STŘÍBRNÉ KARTY */

.card.silver{
background:linear-gradient(
145deg,#f1f5ff,#a8b3c4 40%,#8995a5 70%,#dce4ef
);
color:#17212f;
border-color:#e1e8f2;
text-shadow:none;
}

/* ZLATÉ KARTY */

.card.gold{
background:linear-gradient(
145deg,#fff1b0,#e8bd4e 40%,#b58b32 70%,#f9d978
);
color:#3e2908;
border-color:#ffe18a;
text-shadow:none;
}

.inner{
border:1px solid currentColor;
border-radius:4px;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
padding:3px 0;
}

.number{
font-size:clamp(20px,5vw,32px);
font-weight:bold;
}

.name{
font-size:clamp(9px,2.5vw,15px);
overflow-wrap:anywhere;
max-width:100%;
}

.label{font-size:10px}

/* STAVY KARTIČEK */

.card[data-state="0"]{
opacity:.75;
}

.card[data-state="1"]{
border-color:#ffe18a;
box-shadow:0 0 9px #ffd65c;
}

.card[data-state="2"]{
border-color:#8ce4b3;
box-shadow:0 0 10px #4ac780;
}

.card[data-state="2"] .symbol{
background:#174c35;
color:#d0ffe1;
border-radius:12px;
padding:2px 5px;
}

.progress{
height:6px;
background:#100e18;
border-radius:8px;
overflow:hidden;
}

.progress i{
display:block;
height:100%;
background:#d9b76d;
}

.complete{
border-color:#ffe18a;
box-shadow:0 0 14px #d9b76d66;
}

.token{
text-align:center;
font-size:12px;
margin:8px 0 0;
}

.complete .token,#sync{
color:#8ce4b3;
}

#message,#account,#sync{
overflow-wrap:anywhere;
font-size:13px;
}

footer{
text-align:center;
padding:20px;
}

@media(max-width:380px){
body{padding:7px}
.set{padding:7px}
.label{font-size:9px}
.cards{gap:3px}
}
</style>
</head>

<body>
<main>

<!-- PŘIHLÁŠENÍ -->

<section id="login" class="panel">

<div class="magic">✦ ⚡ ✦</div>
<small>BRADAVICKÝ ARCHIV</small>
<h1>Kniha kouzelných sad</h1>

<input id="email"
type="email"
autocomplete="email"
placeholder="E-mail"
aria-label="E-mail">

<input id="password"
type="password"
autocomplete="current-password"
placeholder="Heslo"
aria-label="Heslo">

<button id="signin" class="primary" disabled>
Přihlásit se
</button>

<button id="register" disabled>
Vytvořit účet
</button>

<button id="forgot" disabled>
Zapomenuté heslo
</button>

<p id="message">
Načítání portálu…
</p>

</section>

<!-- HLAVNÍ ARCHIV -->

<section id="archive" hidden>

<header class="panel">

<div class="magic">✦ ☾ ✦</div>
<small>BRADAVICKÝ ARCHIV · III</small>
<h1>Kniha kouzelných sad</h1>

<p id="account"></p>
<p id="sync"></p>

<div class="stats">

<div class="stat">
<b id="missing">100</b>
Nemám
</div>

<div class="stat">
<b id="owned">0</b>
Mám u sebe
</div>

<div class="stat">
<b id="done">0</b>
Hotovo
</div>

</div>

<div class="progress">
<i id="bar"></i>
</div>

<p id="percent"></p>

<div class="tokens">

<div class="stat">
<b id="intellect">0 / 10</b>
✧ Tokeny intelektu
</div>

<div class="stat">
<b id="power">0 / 10</b>
⚡ Tokeny magické síly
</div>

</div>

<p id="completed"></p>

<small>
Nemám → Mám → Hotovo → Nemám
</small>

<div class="controls">

<select id="filter">
<option value="all">Všechny karty</option>
<option value="0">Nemám</option>
<option value="1">Mám u sebe</option>
<option value="2">Hotovo</option>
</select>

<select id="category">
<option value="all">Všechny sady</option>
<option value="0">Intelekt</option>
<option value="1">Magická síla</option>
</select>

<button id="reset" disabled>
Vynulovat
</button>

<button id="logout">
Odhlásit se
</button>

</div>

</header>

<div id="sets"></div>

<footer>
✦ Mischief managed ✦
</footer>

</section>
</main>

<script type="module">

import {initializeApp}
from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
sendPasswordResetEmail,
signOut
}
from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';

/* FIREBASE */

const app=initializeApp({
apiKey:'AIzaSyBt-Y_2EttZ9zqcccBeZuZAVa4gmTCPafA',
authDomain:'bradavicky-archiv.firebaseapp.com',
projectId:'bradavicky-archiv',
storageBucket:'bradavicky-archiv.firebasestorage.app',
messagingSenderId:'871394630583',
appId:'1:871394630583:web:408afaa6bf8ba46c40e632'
});

const auth=getAuth(app);
const db=getFirestore(app);

auth.languageCode='cs';

/* VŠECH 20 SAD */

const raw=[

// INTELEKT I.
'1 Merlin|2 Agrippa|3 Clagg|4 Stump|8 Shimpling',

// INTELEKT II.
'5 Pokeby|6 Peakes|11 Foul|13 Invincible|14 Fearful',

// INTELEKT III.
'7 Starky|9 Gorsemoor|10 Muldoon|16 Cliodne|17 Morgana',

// INTELEKT IV.
'12 Malicious|15 Paracelsus|18 Oddball|20 Vendelina|22 Circe',

// INTELEKT V.
'19 Scamander|21 Withers|23 Glenda|24 Waffling|27 Plunkett',

// INTELEKT VI.
'25 Perpetua|26 Sawbridge|30 Lufkin|34 Tremlett|40 Pinkstone',

// INTELEKT VII.
'28 Toke|29 Aldeton|31 Bame|35 Wright|36 Wackock',

// INTELEKT VIII.
'32 Wenlock|33 Majorbanks|38 Oldridge|39 Jones|41 Nebelvir',

// INTELEKT IX.
'37 Walblattsky|42 Cronk|43 Youdle|44 Whitehorn|46 Goshawk',

// INTELEKT X.
'45 Oglethorpe|47 Stroulgeer|48 Zmijozel|49 Ketteridge|52 Felix',

// MAGICKÁ SÍLA I.
'50 Barkwith|51 Ready|53 Catchglove|54 Schingleton|55 Nutcombe',

// MAGICKÁ SÍLA II.
'56 Cramb|57 Ollerton|58 Hipworth|59 Smarmy|69 Bott',

// MAGICKÁ SÍLA III.
'60 Montmorency|61 Sweeting|62 Wildsmith|63 Wintringham|64 Sykes',

// MAGICKÁ SÍLA IV.
'65 Oliphant|66 Belby|67 Pilliwickle|68 Duke|72 Helga',

// MAGICKÁ SÍLA V.
'70 Smethwyck|71 Maeve|75 Bonham|76 Wagtail|77 Twonk',

// MAGICKÁ SÍLA VI.
'73 Mopsus|74 Knightly|78 Thurston|79 Beamish|80 Bloxam',

// MAGICKÁ SÍLA VII.
'81 Po|83 Plumpton|84 Kegg|87 Thurkel|89 Toothill',

// MAGICKÁ SÍLA VIII.
'82 Rowena|85 Stalk|86 Wellbeloved|88 Warbeck|90 Tugwood',

// MAGICKÁ SÍLA IX.
'91 Elphick|92 Rastrick|93 Barbary|94 Grawes|97 Grunion',

// MAGICKÁ SÍLA X.
'95 Platt|96 Woodcroft|98 Furmage|99 Dodderidge|101 Brumbal'

];

const groups=raw.map(s=>
s.split('|').map(c=>{
const i=c.indexOf(' ');
return [
Number(c.slice(0,i)),
c.slice(i+1)
];
})
);

const ids=groups.flat().map(c=>c[0]);

/* VZÁCNOST KARTIČEK */

const silver=new Set([
3,8,13,14,16,17,20,22,23,27,
30,34,35,36,38,39,42,43,45,
52,54,55,56,59,60,62,65,68,
70,71,73,79,84,87,89,85,90,
92,97,98,99
]);

const gold=new Set([
11,15,40,41,48,69,72,74,82,101
]);

const $=id=>document.getElementById(id);

const labels=[
'Nemám',
'Mám',
'Hotovo'
];

const symbols=[
'✧',
'✓',
'✓✓'
];

const roman=[
'I','II','III','IV','V',
'VI','VII','VIII','IX','X'
];

let states={};
let user=null;
let unsub=null;
let ready=false;
let pending=0;
let session=0;

const state=n=>
[1,2].includes(states[n])?states[n]:0;

/* CHYBOVÉ HLÁŠKY */

function error(e){

const errors={
'auth/invalid-credential':
'Nesprávný e-mail nebo heslo.',

'auth/email-already-in-use':
'Tento e-mail již má účet.',

'auth/weak-password':
'Heslo musí mít alespoň 6 znaků.',

'auth/invalid-email':
'Neplatný e-mail.',

'auth/network-request-failed':
'Zkontroluj internet.',

'permission-denied':
'Zkontroluj pravidla databáze.'
};

return errors[e.code]||
('Chyba: '+(e.code||e.message));

}

function lock(v){

['signin','register','forgot'].forEach(id=>{
$(id).disabled=v;
});

}

/* REGISTRACE A PŘIHLÁŠENÍ */

for(const id of ['signin','register','forgot']){

$(id).onclick=async()=>{

lock(true);
$('message').textContent='Pracuji…';

try{

const email=$('email').value.trim();
const pass=$('password').value;

if(id==='signin'){
await signInWithEmailAndPassword(
auth,email,pass
);
}

if(id==='register'){
await createUserWithEmailAndPassword(
auth,email,pass
);
}

if(id==='forgot'){

await sendPasswordResetEmail(auth,email);

$('message').textContent=
'Pokud účet existuje, přijde e-mail pro obnovu hesla.';

}

}catch(e){

$('message').textContent=error(e);

}finally{

lock(false);

}

};

}

/* ODHLÁŠENÍ */

$('logout').onclick=async()=>{

if(pending){
return alert('Počkej na uložení.');
}

try{

await signOut(auth);

}catch(e){

$('sync').textContent=error(e);

}

};

/* SYNCHRONIZACE ÚČTU */

onAuthStateChanged(auth,u=>{

const s=++session;

if(unsub)unsub();

user=u;
ready=false;
pending=0;
states={};

$('password').value='';
$('login').hidden=!!u;
$('archive').hidden=!u;
$('reset').disabled=true;

if(!u){

lock(false);
$('message').textContent='';
return;

}

$('account').textContent=u.email;
$('sync').textContent='Načítání sbírky…';

render();

unsub=onSnapshot(

doc(db,'users',u.uid),

{includeMetadataChanges:true},

snap=>{

if(s!==session)return;

states=snap.data()?.cards||{};

ready=!snap.metadata.fromCache||ready;

$('reset').disabled=!ready;

$('sync').textContent=

snap.metadata.hasPendingWrites?
'☁ Ukládání…':

snap.metadata.fromCache?
'☁ Čekám na připojení':

'✓ Synchronizováno';

render();

},

e=>{

if(s!==session)return;

ready=false;
$('reset').disabled=true;
$('sync').textContent=error(e);

render();

}

);

});

/* UKLÁDÁNÍ KARET */

async function save(cards){

if(!ready||!user)return;

const s=session;

pending++;

$('sync').textContent='☁ Ukládání…';

try{

await setDoc(
doc(db,'users',user.uid),
{cards},
{merge:true}
);

}catch(e){

if(s===session){
$('sync').textContent=error(e);
}

}finally{

if(s===session)pending--;

}

}

/* VYKRESLENÍ ARCHIVU */

function render(){

const counts=[0,0,0];

ids.forEach(n=>{
counts[state(n)]++;
});

['missing','owned','done'].forEach((k,i)=>{
$(k).textContent=counts[i];
});

$('bar').style.width=counts[2]+'%';

$('percent').textContent=
counts[2]+' / 100 · '+counts[2]+' %';

/* TOKENY */

const complete=groups.map(g=>
g.every(c=>state(c[0])===2)
);

const a=complete.slice(0,10)
.filter(Boolean).length;

const b=complete.slice(10)
.filter(Boolean).length;

$('intellect').textContent=a+' / 10';
$('power').textContent=b+' / 10';

$('completed').textContent=
'Dokončené sady: '+(a+b)+' / 20';

/* FILTROVÁNÍ */

const root=$('sets');

root.replaceChildren();

const f=$('filter').value;
const cat=$('category').value;

let last=-1;

groups.forEach((g,i)=>{

const type=i<10?0:1;

if(cat!=='all'&&Number(cat)!==type)return;

const visible=g.filter(c=>
f==='all'||state(c[0])===Number(f)
);

if(!visible.length)return;

/* NADPIS KATEGORIE */

if(last!==type){

const h=document.createElement('h2');

h.textContent=type?
'⚡ SADA PRO MAGICKOU SÍLU':
'✧ SADA PRO INTELEKT';

root.append(h);

last=type;

}

/* JEDNOTLIVÉ SADY */

const box=document.createElement('section');

box.className=
'set'+(complete[i]?' complete':'');

const done=g.filter(c=>
state(c[0])===2
).length;

box.innerHTML=

'<div class="heading">'+

'<h3>Sada pro '+
(type?'magickou sílu':'intelekt')+
' '+roman[i%10]+'.</h3>'+

'<span>'+done+'/5</span>'+

'</div>'+

'<div class="cards"></div>'+

'<div class="progress">'+
'<i style="width:'+done*20+'%"></i>'+
'</div>'+

'<p class="token">'+

(complete[i]?
'✦ Token získán ✦':
'Token zatím nezískán')+

'</p>';

/* JEDNOTLIVÉ KARTIČKY */

visible.forEach(([n,name])=>{

const v=state(n);

const c=document.createElement('button');

c.className='card '+(

gold.has(n)?'gold':
silver.has(n)?'silver':
'bronze'

);

c.dataset.state=v;

c.disabled=!ready;

c.setAttribute(
'aria-label',
'Karta '+n+': '+name+', '+labels[v]
);

c.innerHTML=

'<span class="inner">'+

'<span class="symbol">'+
symbols[v]+
'</span>'+

'<span class="number">'+
n+
'</span>'+

'<span class="name">'+
name+
'</span>'+

'<span class="label">'+
labels[v]+
'</span>'+

'</span>';

/* KLIKNUTÍ NA KARTU */

c.onclick=()=>{

if(!ready)return;

const next=(state(n)+1)%3;

states={
...states,
[n]:next
};

save({[n]:next});

render();

};

box.querySelector('.cards').append(c);

});

root.append(box);

});

}

/* OVLÁDÁNÍ */

$('filter').onchange=render;
$('category').onchange=render;

$('reset').onclick=()=>{

if(
ready&&
confirm('Opravdu vynulovat všech 100 karet?')
){

const cards=Object.fromEntries(
ids.map(n=>[n,0])
);

states=cards;

save(cards);

render();

}

};

</script>
</body>
</html>
